seed: 42

source:
  project_root: ../../..
  images_dir: ../../../images
  comments_tsv: ../../../all_comments.tsv/all_comments.tsv
  news_tsv:
    train: ../../../multimodal_only_samples/multimodal_train.tsv
    validate: ../../../multimodal_only_samples/multimodal_validate.tsv
    test: ../../../multimodal_only_samples/multimodal_test_public.tsv

data:
  output_dir: ../data
  manifest_csv: manifest.csv
  comment_pool_jsonl: comment_pool.jsonl
  raw_comment_trees_jsonl: raw_comment_trees.jsonl
  thread_distillation_results_jsonl: thread_distillation_results.jsonl
  distilled_comment_pool_jsonl: distilled_comment_pool.jsonl
  comment_pool_source: distilled_comment_pool_jsonl
  news_contexts_jsonl: tree_news_contexts.jsonl
  gold_targets_jsonl: tree_gold_targets.jsonl
  train_jsonl: tree_train.jsonl
  val_jsonl: tree_val.jsonl
  test_jsonl: tree_test.jsonl
  stats_json: tree_stats.json

partial_observation:
  observed_ratio: 0.30
  min_total_comments: 2
  max_observed_comments: 3
  max_target_comments_per_news: 5
  top_level_only: false
  exclude_obvious_automated_comments: true

thread_preprocessing:
  enabled: true
  prompt_template_path: ../prompts/thread_relevance_distillation.txt
  min_relevance_score: 0.60
  max_thread_nodes: 20
  max_thread_chars: 6000
  teacher:
    name_or_path: ../../models/Qwen2.5-VL-3B-Instruct
    local_files_only: true
    use_4bit: true
    quant_type: nf4
    double_quant: true
    attn_implementation: sdpa
    min_pixels: 200704
    max_pixels: 401408
    max_new_tokens: 160

prompt:
  template_path: ../prompts/comment_generation.txt

model:
  name_or_path: ../../models/Qwen2.5-VL-3B-Instruct
  local_files_only: true
  use_4bit: true
  quant_type: nf4
  double_quant: true
  attn_implementation: sdpa
  min_pixels: 200704
  max_pixels: 401408
  freeze_vision: true

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

training:
  output_dir: ../outputs/qwen2_5_vl_3b_partial_comment_full_lora
  epochs: 2
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  weight_decay: 0.01
  warmup_ratio: 0.05
  logging_steps: 1
  save_steps: 8
  eval_steps: 8
  save_total_limit: 2
  num_workers: 0
  gradient_checkpointing: true
  optimizer: paged_adamw_8bit
  max_grad_norm: 1.0
  max_sequence_length: 1280

generation:
  comments_per_news: 5
  temperature: 0.85
  top_p: 0.90
  repetition_penalty: 1.08
  max_new_tokens: 128

evaluation:
  hallucination_phrases:
    - i was there
    - i live there
    - according to official reports
    - i witnessed
    - my friend works there

detector:
  label_column: 3_way_label
