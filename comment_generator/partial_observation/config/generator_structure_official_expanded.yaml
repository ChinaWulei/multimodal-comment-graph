# Expanded, still split-preserving Fakeddit structure-SFT protocol.
# It reuses the same decoded images, raw trees and label-free relevance records
# as the official protocol, but permits moderately longer human comments.
seed: 42

source:
  project_root: ../../..
  images_dir: ../../../images
  comments_tsv: ../../../all_comments.tsv/all_comments.tsv
  news_tsv:
    train: ../../../multimodal_only_samples/multimodal_train.tsv
    validate: ../../../multimodal_only_samples/multimodal_validate.tsv
    test: ../../../multimodal_only_samples/multimodal_test_public.tsv

data:
  output_dir: ../data/official_subset
  raw_comment_trees_jsonl: raw_comment_trees.jsonl
  thread_distillation_results_jsonl: thread_distillation_results.jsonl
  distilled_comment_pool_jsonl: distilled_comment_pool.jsonl
  structure_train_jsonl: structure_train_expanded.jsonl
  structure_validate_jsonl: structure_validate_expanded.jsonl
  structure_test_jsonl: structure_test_expanded.jsonl
  structure_stats_json: structure_stats_expanded.json

structure_aware:
  min_relevance_score: 0.60
  max_context_nodes: 12
  max_comment_characters: 400

thread_preprocessing:
  prompt_template_path: ../prompts/thread_relevance_distillation.txt
  min_relevance_score: 0.60
  max_thread_nodes: 20
  max_thread_chars: 6000
  teacher:
    name_or_path: ../../models/Qwen2.5-VL-3B-Instruct
    local_files_only: true
    use_4bit: true
    quant_type: nf4
    double_quant: true
    attn_implementation: sdpa
    min_pixels: 200704
    max_pixels: 401408
    max_new_tokens: 160

model:
  name_or_path: ../../models/Qwen2.5-VL-3B-Instruct
  local_files_only: true
  use_4bit: true
  quant_type: nf4
  double_quant: true
  attn_implementation: sdpa
  min_pixels: 200704
  max_pixels: 401408
  freeze_vision: true

prompt:
  template_path: ../prompts/structured_comment_generation.txt

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

training:
  output_dir: ../outputs/qwen2_5_vl_3b_structure_comment_official_expanded_lora
  epochs: 2
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  weight_decay: 0.01
  warmup_ratio: 0.05
  logging_steps: 5
  save_steps: 50
  eval_steps: 50
  save_total_limit: 2
  num_workers: 0
  gradient_checkpointing: true
  optimizer: paged_adamw_8bit
  max_grad_norm: 1.0
  max_sequence_length: 2048

formal_training:
  validation_jsonl: structure_validate_expanded.jsonl
  output_dir: ../outputs/qwen2_5_vl_3b_structure_comment_official_expanded_lora

generation:
  nodes_per_graph: 5
  max_attempts_per_node: 3
  max_generated_depth: 6
  temperature: 0.85
  top_p: 0.90
  repetition_penalty: 1.08
  max_new_tokens: 160
